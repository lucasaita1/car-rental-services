services:
  mysql-user:
    image: mysql:8.1
    container_name: car_rental_mysql_user
    restart: unless-stopped
    env_file:
      - user-microservice/.env
    ports:
      - "3306:3306"
    volumes:
      - mysql_data_user:/var/lib/mysql

  mysql-car:
    image: mysql:8.1
    container_name: car_rental_mysql_car
    restart: unless-stopped
    env_file:
      - car-microservice/.env
    ports:
      - "3307:3306"
    volumes:
      - mysql_data_car:/var/lib/mysql

  mongo:
    image: mongo:7
    container_name: car_rental_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7
    container_name: car_rental_redis
    restart: unless-stopped

  user-service:
    build: ./user-microservice
    container_name: user-microservice
    restart: unless-stopped
    depends_on:
      - mysql-user
      - redis
    env_file:
      - user-microservice/.env
    ports:
      - "8081:8081"
    environment:
      - MYSQL_HOST=mysql-user
      - MYSQL_PORT=3306
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - CAR_SERVICE_URL=http://car-service:8082

  car-service:
    build: ./car-microservice
    container_name: car-microservice
    restart: unless-stopped
    depends_on:
      - mysql-car
      - redis
    env_file:
      - car-microservice/.env
    ports:
      - "8082:8082"
    environment:
      - MYSQL_HOST=mysql-car
      - MYSQL_PORT=3306
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=

  email-service:
    build: ./email-microservice
    container_name: email-microservice
    restart: unless-stopped
    depends_on:
      - mongo
    env_file:
      - email-microservice/.env
    ports:
      - "8083:8083"
    environment:
      - MONGODB_URI=mongodb://mongo:27017/email-service

volumes:
  mysql_data_user:
  mysql_data_car:
  mongo_data:
