name: CI - Build, Testes e Cobertura

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar o repositório
        uses: actions/checkout@v4

      - name: Instalar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Compilar o projeto
        run: mvn -B clean compile

  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Clonar o repositório
        uses: actions/checkout@v4

      - name: Instalar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Rodar testes
        run: mvn -B test

      - name: Cobertura de testes (JaCoCo)
        run: mvn -B verify -pl car-microservice -am

      # --- Atividade 1: Quality Gate com IA real ---
      # Lê car-microservice/target/site/jacoco/jacoco.xml (gerado pelo step
      # acima) e pergunta à IA se o pipeline pode avançar. Bloqueia o job
      # (exit 1) se a IA reprovar.
      - name: AI Quality Gate (aprova ou bloqueia o pipeline)
        env:
          GROQCLOUD_API_KEY: ${{ secrets.GROQCLOUD_API_KEY }}
        run: bash scripts/quality-gate.sh

      - name: Publicar relatório JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: car-microservice/target/site/jacoco

  lint:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Clonar o repositório
        uses: actions/checkout@v4

      - name: Instalar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Rodar Checkstyle
        run: mvn -B checkstyle:check -Dcheckstyle.violationSeverity=warning -Dcheckstyle.failOnViolation=false
