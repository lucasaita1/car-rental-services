name: CI - Build, Testes e Cobertura

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar o repositório
        uses: actions/checkout@v4

      - name: Instalar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Compilar o projeto
        run: mvn -B clean compile

  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Clonar o repositório
        uses: actions/checkout@v4

      - name: Instalar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Rodar testes
        run: mvn -B test

      - name: Cobertura de testes (JaCoCo)
        run: mvn -B verify -pl car-microservice -am

      - name: Publicar relatório JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: car-microservice/target/site/jacoco

  lint:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Clonar o repositório
        uses: actions/checkout@v4

      - name: Instalar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Rodar Checkstyle
        run: mvn -B checkstyle:check